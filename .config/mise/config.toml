[tools]
babashka = { version = "latest", exe = "bb" }
clojure = "latest"
java = "26"

[tasks.build]
description = "Build the debug module"
run = "cargo build"

[tasks.fixtures]
description = "Build the test fixture jars"
depends = ["build"]
run = "test/build-fixtures.sh"

[tasks.package-test]
description = "Install the archive in a scratch package dir and smoke-test it"
depends = ["package"]
run = "emacs -Q --batch -l test/package/smoke-test.el target/package/jvm-*.tar"
